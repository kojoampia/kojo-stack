name: CI

# Mirrors the Jenkinsfile: verify first, then build and publish the image.
# The Docker build runs `npm run build:prod` but no tests, so the verify job
# below is the only thing standing between a regression and a published image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.jojoaddison.net
  IMAGE_NAME: kojo-stack

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # karma.conf.js probes the usual Chrome paths; the runner image ships
      # Google Chrome, and ChromeHeadlessCI passes --no-sandbox for the container.
      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build:prod

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/kojo-stack/browser
          retention-days: 7

  publish:
    name: Build and push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry is self-hosted. If these secrets are absent the job stops
      # here with a clear message rather than failing deep inside a push.
      - name: Check registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD repository secrets are not set."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Derive version tag
        id: version
        run: echo "value=$(date -u +%Y.%m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}`'
            echo ""
            echo "Also tagged \`sha-${{ github.sha }}\` and \`latest\`."
            echo ""
            echo "The compose stacks in kojo-stack-ci pin explicit tags, so nothing"
            echo "deploys until that pin is updated."
          } >> "$GITHUB_STEP_SUMMARY"
