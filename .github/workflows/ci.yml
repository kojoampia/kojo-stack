name: CI

# Build-and-test gate for pull requests and the default branch. Publishing the deployable
# image is a separate concern (.github/workflows/publish.yml) that runs only on main and tags.
#
# The Dockerfile runs build:prod but no tests, so this is the only place they execute.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # karma.conf.js probes the usual Chrome paths; the runner image ships
      # Google Chrome, and ChromeHeadlessCI passes --no-sandbox for the container.
      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build:prod

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/kojo-stack/browser
          retention-days: 7
