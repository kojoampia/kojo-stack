# Kojo Stack - Nginx Configuration for Angular SPA

server {
    listen 80;
    server_name _;

    # Gzip compression. woff2/ttf and images are already compressed, so they are
    # deliberately absent: re-compressing them costs CPU and gains nothing.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1000;
    gzip_vary on;

    # Root directory for Angular application
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # The CSP is deliberately left as-is: it is permissive (allows any https
    # origin) but the hire page embeds the PayPal SDK, which pulls scripts,
    # images and frames from several paypal domains. Tightening it is worthwhile
    # but needs the payment flow exercised first.
    #
    # nginx only inherits add_header from an outer block when the inner block
    # declares none of its own. Every location below that sets a header therefore
    # repeats these, otherwise the SPA shell and all static assets would be served
    # with no security headers at all.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Content-hashed build output: safe to cache forever.
    # Every emitted .js/.css/font carries a content hash (outputHashing: all), so
    # a new deploy produces a new URL rather than needing revalidation.
    location ~* "^/(media/.*|.*-[A-Z0-9]{8}\.(?:js|css))$" {
        # Single directive: "expires" would emit a second Cache-Control header.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Unhashed static assets: favicons, PWA icons, manifest, CV and images.
    # These keep stable filenames across deploys, so an immutable year-long cache
    # would make them permanently un-updatable. A day, revalidated, is enough.
    location ~* ^/(assets/.*|favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|android-chrome-\d+x\d+\.png|manifest\.json)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Main application routes - serve index.html for SPA routing.
    # index.html must never be cached: it carries the hashed script references,
    # so a stale copy pins the browser to a previous deploy's assets.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    }

    # OTLP HTTP proxy for browser telemetry export
    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
